name: Web CI

on:
  pull_request:
    paths:
      - 'Events-Project/**'
      - '.github/workflows/ci.yml'
  push:
    branches: [main]
    paths:
      - 'Events-Project/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Typecheck, lint, offline tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Events-Project
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Sem engines/.nvmrc no projeto; Node 20 LTS.
          node-version: '20'
          cache: npm
          cache-dependency-path: Events-Project/package-lock.json

      # npm ci simples falha com ERESOLVE (peer deps do HeroUI/Next); --legacy-peer-deps é obrigatório.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Só gera o client; não conecta ao banco nem aplica migrações.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck (app)
        run: npm run typecheck

      - name: Typecheck (socket server)
        run: npx tsc --project tsconfig.server.json --noEmit

      - name: Lint
        run: npm run lint

      # Suítes offline apenas: nunca executa scripts :db/:http.
      - name: Offline tests
        run: npm run test:offline

      # Placeholders públicos e não secretos: as rotas que usam banco/sessão são dinâmicas,
      # então o build não conecta ao PostgreSQL nem precisa de credenciais reais.
      - name: Build
        run: npx next build
        env:
          NODE_ENV: production
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/eventmap_ci
          NEXTAUTH_URL: http://localhost:3000
          NEXT_PUBLIC_BASE_URL: http://localhost:3000
          NEXTAUTH_SECRET: ci-build-placeholder-not-a-real-secret
